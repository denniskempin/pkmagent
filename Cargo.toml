[package]
name = "pkmagent"
version = "0.1.0"
edition = "2021"
description = "Local read-only importer for Gmail, Messages, Calendar, and Contacts"
publish = false

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
chrono-tz = "0.10"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-event-kit = "0.3.2"
objc2 = ">=0.6.2, <0.8.0"
objc2-foundation = "0.3.2"
block2 = ">=0.6.1, <0.8.0"
